# Smithery configuration for IBAMA: Certificado de Regularidade
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ibama_certificado_regularidade

name: ibama_certificado_regularidade-mcp
displayName: "IBAMA: Certificado de Regularidade"
description: >
  IBAMA: Certificado de Regularidade, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ibama_certificado_regularidade-mcp
repository: https://github.com/mcp-dir/ibama_certificado_regularidade-mcp

tags:
  - ibama_certificado_regularidade
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ibama_certificado_regularidade

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ibama_certificado_regularidade/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
